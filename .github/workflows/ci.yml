name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"     # lunes 09:00 Chile: detecta cambios de formato en las fuentes

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Pipeline completo desde los datos crudos
        run: python run_pipeline.py
      - name: Guardar reportes
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            reports/
            app/index.html
