name: pages

# Publica el tablero de resultados y el simulador (app/) en GitHub Pages.
# Requiere una vez: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["app/**", "reports/figuras/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir -p sitio/figuras
          cp app/tablero.html sitio/index.html
          cp app/index.html sitio/simulador.html
          cp reports/figuras/*.png sitio/figuras/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deploy
        uses: actions/deploy-pages@v4
